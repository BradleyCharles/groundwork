name: Sync template repo
# Publishes the template-mode output to the groundwork-template repository on each release.
# The default GITHUB_TOKEN can only write to this repository, so this uses TEMPLATE_REPO_TOKEN:
# a fine-grained token limited to the template repo (Contents: read and write). See docs/template-repo.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Label for the sync commit message
        default: manual
        required: true
permissions:
  contents: read
concurrency:
  group: sync-template
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate the template-mode project
        run: node packages/create-groundwork/dist/cli.js new ../template-out --config test/presets/template.json --yes --no-install --no-git --template-mode
      - name: Push to the template repository
        env:
          TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
          TEMPLATE_REPO: ${{ github.repository_owner }}/groundwork-template
        run: node scripts/sync-template-repo.mjs ../template-out
