name: Golden project
# Runs the generated-project checks against golden/. These mirror golden/.github/workflows/,
# which only run once golden/ is its own repository.
on:
  pull_request:
    paths: ["golden/**", ".github/workflows/golden.yml"]
  push:
    branches: [main]
    paths: ["golden/**", ".github/workflows/golden.yml"]
permissions:
  contents: read
defaults:
  run:
    working-directory: golden
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-public-key
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: golden/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:render -- --check
      - run: npm run docs:lint
      - run: npm run build
      - run: npm audit --audit-level=high

  hooks:
    # Hook scripts must behave the same on Linux and Windows.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: golden/package-lock.json
      - run: npm ci
      - run: npx vitest run tests/hooks

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: golden/package-lock.json
      - run: npm ci
      - run: npx supabase start -x studio,storage-api,imgproxy,realtime,logflare,vector,mailpit,edge-runtime,postgres-meta
      - run: npx supabase db reset
      - run: npx supabase test db
      - name: Generated docs match migrations
        run: |
          node scripts/db/generate-living-docs.mjs
          git diff --exit-code -- supabase/schema.sql supabase/policies.sql
      - name: Generated docs apply to a fresh database
        run: node scripts/db/verify-fresh-build.mjs

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: golden/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            golden/playwright-report/
            golden/test-results/
          if-no-files-found: ignore

  docs-check:
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Check living docs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/docs/check-living-docs.mjs --base "origin/$BASE_REF"
