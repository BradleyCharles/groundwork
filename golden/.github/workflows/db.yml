name: Database
on:
  pull_request:
    paths: ["supabase/**", "scripts/db/**", ".github/workflows/db.yml"]
  push:
    branches: [main]
    paths: ["supabase/**", "scripts/db/**"]
permissions:
  contents: read
jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Only the services the checks need; keeps startup fast.
      - run: npx supabase start -x studio,storage-api,imgproxy,realtime,logflare,vector,mailpit,edge-runtime,postgres-meta
      - run: npx supabase db reset
      - run: npx supabase test db
      - name: Generated docs match migrations
        run: |
          node scripts/db/generate-living-docs.mjs
          git diff --exit-code -- supabase/schema.sql supabase/policies.sql
      - name: Generated docs apply to a fresh database
        run: node scripts/db/verify-fresh-build.mjs
